- text: "To realise in the end that the destination was never the point: what we were looking for is what we lost, found again somewhere else, because it is another time, because we are someone else, and because there is no other way to find what we have lost."
  original: "Darse cuenta al final de que no era destino el asunto, es que eso que buscábamos es lo mismo que perdimos, pero que lo hemos encontrado en otro lugar, porque es otro tiempo, porque uno es otro y porque no hay otra posibilidad de encontrar lo que hemos perdido."
  author: null
  source: null

- text: "Dream big, start small then connect the dots. A little of something is better than a lot of nothing."
