  source: null

- text: "When we die we lose not only our body but also the people who live on in our memory."
  original: "Cuando muramos no solo perderemos nuestro cuerpo sino también a aquellos que persisten en nuestra memoria."
  author: null
  source: null

- text: "Metaphors and stories are far more powerful than ideas. [...] Ideas come and go; stories stay."
  original: "Las metáforas y las historias tienen muchísima más fuerza que las ideas. [...] . Las ideas van y vienen, las historias permanecen."
