- text: "Not all success comes from hard work, and not all poverty from laziness."
  original: "No todo el éxito se debe al trabajo duro, ni toda la pobreza a la pereza."
  author: null
  source: null

- text: "There is no reason to risk what you have and need for something you don't have and don't need."
  original: "No hay motivo alguno para arriesgar lo que tienes y necesitas, por algo que no tienes y no necesitas."
  author: null
  source: null

- text: "I have no sunk costs."
  original: "No tengo costes irrecuperables."
  author: null
  source: null

- text: "Not every price comes on a tag."
  original: "No todos los precios vienen en una etiqueta."
  author: null
  source: null

- text: "Get used to lots of things going wrong; you can be wrong half the time and still win. A small number of things decide the outcome."
  original: "Acostúmbrate a que un montón de cosas salgan mal; equivocándote la mitad de las veces puedes ganar -> Una pequeña cantidad de cosas son responsables del resultado"
  author: null
  source: null

- text: "People are not driven by past causes, but move towards goals they set for themselves."
