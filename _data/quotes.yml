  source: null

- text: "A lack of ideas is made up for with an excess of ideology."
  original: "La falta de ideas se compensa con exceso de ideología."
  author: null
  source: null

- text: "What saddens me is not that you lied to me, but that I can never trust you again."
  original: "Lo que me entristece no es que me hayas mentido, sino que ya nunca podré confiar en ti."
  author: null
  source: null

- text: "You must find a truth that is true for you, an idea you can live and die for."
  original: "Debes encontrar una verdad que sea cierta para ti, una idea por la cual puedas vivir y morir."
