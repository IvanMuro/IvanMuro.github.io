# Site Settings
title: "Dr. Iván Muñoz Rodríguez"
description: "Postdoctoral Researcher in X-ray Astrophysics at CEA Paris-Saclay"
url: "https://yourusername.github.io" # Update with your GitHub username
baseurl: "" # Leave empty for user site, or "/repo-name" for project site
repository: "yourusername/yourusername.github.io" # Update with your repo

# Author Information
author:
  name: "Iván Muñoz Rodríguez"
  title: "Postdoctoral Researcher"
  affiliation: "CEA Paris-Saclay"
  department: "Astrophysics Department (DAp)"
  email: "imrphys@gmail.com"
  orcid: "0000-0001-7161-4112"
  github: "IvanMuro"
  ads_library: "https://ui.adsabs.harvard.edu/search/q=orcid%3A0000-0001-7161-4112"
  google_scholar: ""
  twitter: ""
  linkedin: ""

# Research Keywords (for SEO)
keywords:
  - X-ray astrophysics
  - Active Galactic Nuclei
  - Galaxy clusters
  - Supermassive black holes
  - Semi-empirical modelling
  - Data analysis
  - Python

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:title/

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Collections (for blog)
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

# Plugins (GitHub Pages compatible)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Navigation
navigation:
  - title: About
    url: /
  - title: Research
    url: /research/
  - title: Publications
    url: /publications/
  - title: CV
    url: /cv/
  # - title: Blog  # Uncomment to enable blog in navigation
  #   url: /blog/
  - title: Contact
    url: /contact/

# Feature Flags
features:
  dark_mode: true
  blog_enabled: false  # Set to true to enable blog
  reading_list: false  # Set to true to show "Currently Reading" section
