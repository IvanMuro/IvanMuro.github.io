<header class="site-header">
  <div class="container">
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" class="site-logo">
        <span class="logo-text">IMR</span>
      </a>

      <button
        id="nav-toggle"
        class="nav-toggle"
        aria-expanded="false"
        aria-controls="nav-menu"
        aria-label="Toggle navigation"
      >
        <span class="hamburger"></span>
      </button>

      <ul id="nav-menu" class="nav-menu">
        {% for item in site.navigation %}
        <li class="nav-item">
          <a href="{{ item.url | relative_url }}"
             class="nav-link {% if page.url == item.url %}is-active{% endif %}">
            {{ item.title }}
          </a>
        </li>
        {% endfor %}
        {% if site.features.dark_mode %}
        <li class="nav-item nav-item--theme">
          <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
            <svg class="icon icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="icon icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </li>
        {% endif %}
      </ul>
    </nav>
  </div>
</header>
