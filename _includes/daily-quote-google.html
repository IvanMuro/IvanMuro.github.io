<!--
  Google Sheets Version of Daily Quote

  To use this instead of the local version:
  1. Replace {% include daily-quote.html %} with {% include daily-quote-google.html %} in index.md
  2. Set up your Google Sheet (see README for instructions)
  3. Update the SHEET_URL below with your published sheet URL
-->

<div class="daily-quote" id="daily-quote">
  <blockquote class="quote-text" id="quote-text">
    <p>Loading...</p>
  </blockquote>
  <cite class="quote-attribution" id="quote-attribution"></cite>
</div>

<script>
(function() {
  // ============================================
  // CONFIGURATION - Update this URL with your Google Sheet
  // ============================================
  // To get this URL:
  // 1. Open your Google Sheet
  // 2. Go to File → Share → Publish to web
  // 3. Select the sheet tab and choose "Comma-separated values (.csv)"
  // 4. Click Publish and copy the URL
  const SHEET_URL = 'YOUR_GOOGLE_SHEET_CSV_URL_HERE';

  // Fallback quotes in case Google Sheets fails
  const fallbackQuotes = [
    { text: "The cosmos is within us. We are made of star-stuff.", author: "Carl Sagan" },
    { text: "Somewhere, something incredible is waiting to be known.", author: "Carl Sagan" },
    { text: "Look up at the stars and not down at your feet.", author: "Stephen Hawking" }
  ];

  // ============================================

  function getDayOfYear() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start;
    const oneDay = 1000 * 60 * 60 * 24;
    return Math.floor(diff / oneDay);
  }

  function displayQuote(quote) {
    const textEl = document.querySelector('#quote-text p');
    const attrEl = document.getElementById('quote-attribution');

    if (textEl && attrEl && quote) {
      textEl.textContent = quote.text;
      let attribution = '— ' + quote.author;
      if (quote.source) {
        attribution += ', ' + quote.source;
      }
      attrEl.textContent = attribution;
    }
  }

  function parseCSV(csvText) {
    const lines = csvText.trim().split('\n');
    const quotes = [];

    // Skip header row (assumes columns: text, author, source)
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i];
      // Simple CSV parsing (handles basic cases)
      const match = line.match(/^"?([^"]*)"?,\s*"?([^"]*)"?,?\s*"?([^"]*)"?$/);
      if (match) {
        quotes.push({
          text: match[1].trim(),
          author: match[2].trim(),
          source: match[3] ? match[3].trim() : null
        });
      }
    }
    return quotes;
  }

  function selectAndDisplay(quotes) {
    const dayOfYear = getDayOfYear();
    const quoteIndex = dayOfYear % quotes.length;
    displayQuote(quotes[quoteIndex]);
  }

  // Try to fetch from Google Sheets
  if (SHEET_URL && SHEET_URL !== 'YOUR_GOOGLE_SHEET_CSV_URL_HERE') {
    fetch(SHEET_URL)
      .then(response => response.text())
      .then(csvText => {
        const quotes = parseCSV(csvText);
        if (quotes.length > 0) {
          selectAndDisplay(quotes);
        } else {
          selectAndDisplay(fallbackQuotes);
        }
      })
      .catch(error => {
        console.warn('Failed to fetch quotes from Google Sheets, using fallback:', error);
        selectAndDisplay(fallbackQuotes);
      });
  } else {
    // No Google Sheet configured, use fallback
    selectAndDisplay(fallbackQuotes);
  }
})();
</script>
