<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<!-- Primary Meta Tags -->
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
<meta name="description" content="{{ page.description | default: site.description | strip_html | truncate: 160 }}">
<meta name="author" content="{{ site.author.name }}">
<meta name="keywords" content="{{ site.keywords | join: ', ' }}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | truncate: 160 }}">
<meta property="og:image" content="{{ '/assets/images/og-image.jpg' | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="{{ page.url | absolute_url }}">
<meta property="twitter:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
<meta property="twitter:description" content="{{ page.description | default: site.description | strip_html | truncate: 160 }}">
<meta property="twitter:image" content="{{ '/assets/images/og-image.jpg' | absolute_url }}">

<!-- Academic/Scholarly Metadata -->
<meta name="citation_author" content="{{ site.author.name }}">
<meta name="citation_author_institution" content="{{ site.author.affiliation }}">

<!-- ORCID -->
<link rel="me" href="https://orcid.org/{{ site.author.orcid }}">

<!-- Canonical URL -->
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- JSON-LD Structured Data for Google Scholar -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author.name }}",
  "jobTitle": "{{ site.author.title }}",
  "affiliation": {
    "@type": "Organization",
    "name": "{{ site.author.affiliation }}"
  },
  "url": "{{ site.url }}",
  "sameAs": [
    "https://orcid.org/{{ site.author.orcid }}",
    "https://github.com/{{ site.author.github }}"
    {% if site.author.google_scholar %},
    "{{ site.author.google_scholar }}"
    {% endif %}
  ],
  "knowsAbout": {{ site.keywords | jsonify }}
}
</script>

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

<!-- Preconnect to external resources -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Google Fonts - Source Serif Pro for headings, Inter for body, Shadows Into Light for quotes -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Shadows+Into+Light&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">

<!-- Main Stylesheet -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<!-- RSS Feed -->
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

<!-- Jekyll SEO Tag -->
{% seo %}
