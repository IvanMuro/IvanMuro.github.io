<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Set the theme before first paint to avoid a light-mode flash -->
<script>
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('theme'); } catch (e) {}
    if (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      theme = 'dark';
    }
    if (theme) document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<!-- Title, description, canonical URL, Open Graph and Twitter tags come from jekyll-seo-tag at the bottom -->
<meta name="author" content="{{ site.author.name }}">
<meta name="keywords" content="{{ site.keywords | join: ', ' }}">
<meta name="theme-color" content="#fefefe" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">

<!-- Academic/Scholarly Metadata -->
<meta name="citation_author" content="{{ site.author.name }}">
<meta name="citation_author_institution" content="{{ site.author.affiliation }}">

<!-- ORCID -->
<link rel="me" href="https://orcid.org/{{ site.author.orcid }}">

<!-- JSON-LD Structured Data for Google Scholar -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author.name }}",
  "jobTitle": "{{ site.author.title }}",
  "affiliation": {
    "@type": "Organization",
    "name": "{{ site.author.affiliation }}"
  },
  "url": "{{ site.url }}",
  "sameAs": [
    "https://orcid.org/{{ site.author.orcid }}",
    "https://github.com/{{ site.author.github }}"
    {% if site.author.linkedin %},
    "{{ site.author.linkedin }}"
    {% endif %}
    {% if site.author.google_scholar %},
    "{{ site.author.google_scholar }}"
    {% endif %}
  ],
  "knowsAbout": {{ site.keywords | jsonify }}
}
</script>

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/profile.jpg' | relative_url }}">

<!-- Preconnect to external resources -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Google Fonts - Source Serif Pro for headings, Inter for body, Shadows Into Light for quotes -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Shadows+Into+Light&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">

<!-- Main Stylesheet -->
<!-- ?v= changes on every build so browsers fetch the new styles after an update -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">

<!-- RSS Feed -->
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

<!-- Jekyll SEO Tag -->
{% seo %}
