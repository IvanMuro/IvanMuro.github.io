<figure class="daily-quote" id="daily-quote" hidden>
  <blockquote class="quote-text" id="quote-text">
    <p></p>
  </blockquote>
  <figcaption class="quote-label">From my notebook</figcaption>
</figure>
<script>
(function() {
  // Quote data from Jekyll (embedded at build time)
  const quotes = [
    {% for quote in site.data.quotes %}
    {
      text: {{ quote.text | jsonify }},
      author: {{ quote.author | jsonify }},
      source: {{ quote.source | jsonify | default: "null" }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  // Get day of year to use as index (same quote all day, changes at midnight)
  function getDayOfYear() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start;
    const oneDay = 1000 * 60 * 60 * 24;
    return Math.floor(diff / oneDay);
  }

  // Select quote based on day of year
  const dayOfYear = getDayOfYear();
  const quoteIndex = dayOfYear % quotes.length;
  const quote = quotes[quoteIndex];

  // Display the quote
  const textEl = document.querySelector('#quote-text p');

  // The aside stays hidden without JavaScript or without a quote, so no empty quote marks show
  if (textEl && quote && quote.text) {
    textEl.textContent = quote.text;
    // Long quotes are hard to read in the handwritten face; set them in the serif instead
    if (quote.text.length > 140) textEl.classList.add('is-long');
    document.getElementById('daily-quote').hidden = false;
  }
})();
</script>
